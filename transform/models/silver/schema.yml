version: 2

models:
  - name: silver_wallet_transactions
    description: "The table containing wallet transaction data has been refined and cleaned"
    columns:
      - name: transaction_id
        description: "Each transaction event has a unique UUID"
        tests:
          - unique
          - not_null

      - name: amount
        description: "The amount generated from the transaction"
        tests:
          - not_null